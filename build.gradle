plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Put resources (styles.css) in the same folder as the compiled classes
// so the Java module can load them when running with `gradlew run`.
sourceSets {
    main {
        output.resourcesDir = java.destinationDirectory.get().asFile
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javafx {
    version = '21.0.12'
    modules = ['javafx.controls']
}

application {
    mainModule = 'com.example.lodgebilling'
    mainClass = 'com.example.lodgebilling.Main'
}
